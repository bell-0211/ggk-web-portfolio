name: validate-portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency (explicit, no-op)
        run: python -m pip install -r requirements-dev.txt
      - name: Validate committed demo (contract / i18n / asset map / redaction)
        run: python scripts/validate_assets.py
      - name: Deterministic demo smoke test
        run: python scripts/run_demo.py --enforce
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
